services:
  kvrocks:
    image: apache/kvrocks:2.14.0
    container_name: ${CONTAINER_NAME}
    network_mode: host
    restart: unless-stopped
    # TODO: Decide between bind_mount and volumes
    volumes:
      - kvrocks_data:/var/lib/kvrocks
    # masterauth: password for replica->master communication
    command: >
      --bind 0.0.0.0
      --port 6666
      --workers 8
      --requirepass ${KVROCKS_PASSWORD}
      --masterauth ${KVROCKS_PASSWORD}
      --dir /var/lib/kvrocks
      --cluster-enabled yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6666", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  kvrocks_data:
